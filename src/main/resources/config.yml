worlds:
  enabled:
    - world
    - world_nether
    - world_the_end

sounds:
  enabled: true

particles:
  enabled: true

ui:
  confirm_timeout_seconds: 15
  undo_seconds: 20
  trust_nearby_radius: 32.0
  max_undo_history: 5

auto_lock:
  enabled: false
  require_key: true
  sneak_only: false

signs:
  enabled: true

notifications:
  enabled: true
  max_per_player: 20

limits:
  # Maximale Anzahl Locks pro Spieler (0 = kein Limit, aber DoS-Risiko)
  max_locks_per_player: 1000
  # Maximale Anzahl Secure Hopper pro Spieler (0 = kein Limit, aber DoS-Risiko)
  max_hoppers_per_player: 50

cooldowns:
  # Mindestabstand zwischen zwei Lock-Aktionen (Lock/Unlock per Chest-Key) in Millisekunden
  lock_action_ms: 1000
  # Mindestabstand zwischen zwei Break-Versuch-Benachrichtigungen pro Spieler in Millisekunden
  break_notification_ms: 30000

admin:
  logs:
    book_entries: 200
    teleport_enabled: false

recipes:
  chest_key:
    enabled: true
    shape:
      - "NDN"
      - "DHD"
      - "NDN"
    ingredients:
      N: "NETHERITE_INGOT"
      D: "DIAMOND"
      H: "TRIPWIRE_HOOK"

  secure_hopper:
    enabled: true
    shape:
      - " I "
      - "HKH"
      - " I "
    ingredients:
      I: "IRON_BLOCK"
      H: "HOPPER"
      K: "CHEST_KEY"
