language: en

# Whitelist der geschützten Welten: nur hier gelistete Welten sind geschützt.
# Sonderfall: eine leere Liste (enabled: []) bedeutet "alle Welten geschützt",
# nicht "keine Welt geschützt" (Auswertung in Worlds.java und
# PluginConfig.DEFAULT_ENABLED_WORLDS).
# Ausgeliefert werden world, world_nether, world_the_end. Wer eigene Weltnamen
# nutzt (z. B. Skyblock- oder Prefix-Welten), muss sie hier eintragen, sonst
# greift der Schutz dort nicht.
worlds:
  enabled:
    - world
    - world_nether
    - world_the_end

sounds:
  enabled: true

particles:
  enabled: true

ui:
  confirm_timeout_seconds: 15
  undo_seconds: 20
  trust_nearby_radius: 32.0
  max_undo_history: 5

auto_lock:
  enabled: false
  require_key: true
  sneak_only: false

signs:
  enabled: true

notifications:
  enabled: true
  max_per_player: 20

ping:
  # Time limit for a chest ping in seconds (0 = no limit)
  timeout_seconds: 300
  # Seconds the ping keeps running after arrival so the glow shows the container (0 = end at once)
  arrived_seconds: 15
  # Let the pinged container glow for the pinging player only (false = action bar only)
  highlight_enabled: true

limits:
  # Maximale Anzahl Locks pro Spieler (0 = kein Limit, aber DoS-Risiko)
  max_locks_per_player: 1000
  # Maximale Anzahl Secure Hopper pro Spieler (0 = kein Limit, aber DoS-Risiko)
  max_hoppers_per_player: 50

cooldowns:
  # Mindestabstand zwischen zwei Lock-Aktionen (Lock/Unlock per Chest-Key) in Millisekunden
  lock_action_ms: 1000
  # Mindestabstand zwischen zwei Break-Versuch-Benachrichtigungen pro Spieler in Millisekunden
  break_notification_ms: 30000

admin:
  logs:
    book_entries: 200
    teleport_enabled: false

recipes:
  chest_key:
    enabled: true
    shape:
      - "NDN"
      - "DHD"
      - "NDN"
    ingredients:
      N: "NETHERITE_INGOT"
      D: "DIAMOND"
      H: "TRIPWIRE_HOOK"
