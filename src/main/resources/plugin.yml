name: ChestSecure
version: 1.4.0
main: de.SecureChest.plugin.ChestSecurePlugin
api-version: "1.21"
author: "crimethunder"
description: "ChestSecure - Lock & protect containers with keys (Paper 1.21.11)."

commands:
  chestsecure:
    description: "Open ChestSecure GUI. Use /cs reload to reload config."
    usage: "/cs [reload]"
    aliases: [cs]

permissions:
  chestsecure.use:
    description: "Allows using ChestSecure."
    default: true
  chestsecure.admin:
    description: "Admin access: open/break locked blocks, admin panel."
    default: op
